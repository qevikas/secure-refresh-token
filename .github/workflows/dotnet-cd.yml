name: .NET Continuous Delivery

on:
  push: 
    branches: 
      - main
  workflow_dispatch: 
permissions: 
  contents: read

jobs:
  release:
    name: Build, Test and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependecies
        run: dotnet restore SecureRefreshToken.slnx

      - name: Build solution
        run: dotnet build SecureRefreshToken.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test SecureRefreshToken.slnx --configuration Release --no-build

      - name: Publish API
        run: dotnet publish src/SecureRefreshToken.Api/SecureRefreshToken.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: secure-refresh-token-api
          path: ./publish/
          if-no-files-found: error
          retention-days: 7





      
