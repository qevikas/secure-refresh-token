
name: .NET CI

on:
  push:
    branches: ["main", "st-1.1.0"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SecureRefreshToken

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Display SDK version
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore SecureRefreshToken.slnx

      - name: Build solution
        run: dotnet build SecureRefreshToken.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test SecureRefreshToken.slnx --configuration Release --no-build
